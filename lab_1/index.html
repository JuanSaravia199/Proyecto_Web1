<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Proyecto Web</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="layout">

        <header class="header">

            <h1>Mi proyecto web</h1>

            <nav>
                <ul class="nav-lista">
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#caracteristicas">Características</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>

        </header>


        <section id="inicio" class="hero">

            <div>
                <h2>Bienvenido</h2>

                <p>
                    Esta es mi página web para el Laboratorio 2.
                </p>
            </div>

        </section>


        <section id="caracteristicas" class="servicios">

            <h2>Características</h2>

            <div class="cards">

                <div class="card">
                    <h3>HTML5</h3>
                    <p>Estructura de la página.</p>
                </div>

                <div class="card">
                    <h3>CSS3</h3>
                    <p>Diseño y estilos.</p>
                </div>

                <div class="card">
                    <h3>Responsive</h3>
                    <p>Se adapta a diferentes pantallas.</p>
                </div>

            </div>

        </section>


        <section id="contacto" class="contacto">

            <h2>Contacto</h2>

            <form class="p-3 border rounded">

                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    class="form-control mb-3"
                    required
                >

                <label for="correo">Correo</label>

                <input
                    type="email"
                    id="correo"
                    class="form-control mb-3"
                    required
                >

                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    class="form-control mb-3"
                    minlength="10"
                    required
                ></textarea>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enviar
                </button>

            </form>

        </section>


        <footer class="footer">

            <p>2026 Desarrollo de Aplicaciones Web</p>

        </footer>

    </div>

</body>

</html>
